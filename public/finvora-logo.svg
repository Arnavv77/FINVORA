<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="full-ribbon-top" x1="20" y1="20" x2="80" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="full-ribbon-mid" x1="40" y1="30" x2="70" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="full-ribbon-bot" x1="40" y1="50" x2="55" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="full-orbit" x1="25" y1="55" x2="75" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="full-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CFFAFE" />
    </linearGradient>

    <filter id="full-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Emblem translated into (10, 10) -->
  <g transform="translate(10, 10) scale(1)">
    <!-- Back orbit -->
    <path d="M 28 52 C 28 42 76 36 78 44" stroke="url(#full-orbit)" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <!-- Lower stem -->
    <path d="M 42 54 C 42 66 44 76 49 76 C 54 76 55 68 55 58 Z" fill="url(#full-ribbon-bot)" />
    <!-- 3 Bar Chart Columns -->
    <rect x="42" y="44" width="3.5" height="9" rx="1.2" fill="url(#full-bar)" />
    <rect x="47" y="38" width="3.5" height="15" rx="1.2" fill="url(#full-bar)" />
    <rect x="52" y="31" width="3.5" height="22" rx="1.2" fill="url(#full-bar)" />
    <!-- Upper F Ribbon -->
    <path d="M 40 40 C 37 32 40 22 52 19 C 64 16 74 18 73 24 C 72 30 58 35 48 38 C 42 40 38 46 41 53 C 44 58 54 56 63 48 C 65 46 68 47 67 50 C 62 58 48 64 42 58 C 37 53 38 45 40 40 Z" fill="url(#full-ribbon-top)" />
    <path d="M 48 38 C 58 35 72 30 73 24 C 68 28 54 34 46 41 C 41 45 42 51 44 54 C 42 48 43 42 48 38 Z" fill="url(#full-ribbon-mid)" opacity="0.9" />
    <!-- Front orbit -->
    <path d="M 26 53 C 24 59 40 64 68 55 C 75 52 79 47 77 44" stroke="url(#full-orbit)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Sparkles -->
    <path d="M 77 20 Q 77 24 81 24 Q 77 24 77 28 Q 77 24 73 24 Q 77 24 77 20 Z" fill="#22D3EE" filter="url(#full-glow)" />
    <circle cx="77" cy="24" r="1.2" fill="#FFFFFF" />
    <path d="M 32 48 L 33.5 50.5 L 36 52 L 33.5 53.5 L 32 56 L 30.5 53.5 L 28 52 L 30.5 50.5 Z" fill="#34D399" opacity="0.85" />
  </g>

  <!-- Right: Wordmark + Tagline -->
  <g transform="translate(125, 45)">
    <!-- Wordmark "FINVORA" -->
    <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="currentColor">
      FINVORA
    </text>
    <!-- Cyan star on the 'A' -->
    <path d="M 197 18 Q 197 21 200 21 Q 197 21 197 24 Q 197 21 194 21 Q 197 21 197 18 Z" fill="#22D3EE" />

    <!-- Tagline: "Your Goals ✦ Our Analytics" -->
    <text x="2" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" letter-spacing="3" fill="#64748B">
      YOUR GOALS  ✦  OUR ANALYTICS
    </text>
  </g>
</svg>
